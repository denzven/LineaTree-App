<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is essential for iPhone notch / Dynamic Island safe areas -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- ==========================================
         PRIMARY SEO META TAGS
         ========================================== -->
    <title>LineaTree — Heredity &amp; Deep Social Network Mapper</title>
    <meta name="description" content="LineaTree is a zero-database, offline-first Progressive Web App for building family trees and deep social network maps. Works entirely in your browser — no sign-up, no server, no data leaves your device." />
    <meta name="keywords" content="family tree, pedigree chart, genealogy, social network mapper, offline PWA, heredity, lineage, ancestry, relationship mapper, kinship diagram" />
    <meta name="author" content="LineaTree" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#282C34" />
    <link rel="canonical" href="https://lineatree.app/" />

    <!-- ==========================================
         OPEN GRAPH (Facebook, LinkedIn, Discord, etc.)
         ========================================== -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lineatree.app/" />
    <meta property="og:site_name" content="LineaTree" />
    <meta property="og:title" content="LineaTree — Heredity &amp; Deep Social Network Mapper" />
    <meta property="og:description" content="Build family trees and social network maps offline, right in your browser. Zero database, zero sign-up. Your data stays yours." />
    <meta property="og:image" content="https://lineatree.app/pwa-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="LineaTree app icon — a lightning-bolt tree symbol in purple" />
    <meta property="og:locale" content="en_US" />

    <!-- ==========================================
         TWITTER / X CARD
         ========================================== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@lineatree_app" />
    <meta name="twitter:creator" content="@lineatree_app" />
    <meta name="twitter:title" content="LineaTree — Heredity &amp; Deep Social Network Mapper" />
    <meta name="twitter:description" content="Build family trees and social network maps offline, right in your browser. Zero database, zero sign-up. Your data stays yours." />
    <meta name="twitter:image" content="https://lineatree.app/pwa-512x512.png" />
    <meta name="twitter:image:alt" content="LineaTree — offline-first family tree and social network PWA" />

    <!-- ==========================================
         PWA / ICONS
         ========================================== -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS Web App Capability -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LineaTree" />
    <!-- Android / Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="LineaTree" />
    <meta name="msapplication-TileColor" content="#282C34" />
    <meta name="msapplication-TileImage" content="/pwa-192x192.png" />

    <!-- ==========================================
         STRUCTURED DATA (JSON-LD)
         ========================================== -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "LineaTree",
      "alternateName": "LineaTree PWA",
      "url": "https://lineatree.app/",
      "description": "Zero-database offline-first pedigree and deep social network mapping progressive web application.",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Any (Browser-based PWA)",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Offline-first — no internet required after install",
        "Zero-database — all data stays in your browser",
        "Family tree / pedigree builder",
        "Deep social network mapper",
        "Exportable charts",
        "Installable as a native-like app"
      ],
      "screenshot": "https://lineatree.app/pwa-512x512.png",
      "softwareVersion": "1.0.0",
      "creator": {
        "@type": "Organization",
        "name": "LineaTree"
      }
    }
    </script>

    <!-- Font Awesome (icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
